[package]
name = "clap-fixtures"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "runner"

# Golden fixtures of clap 4 behaviour for reclap. See
# packages/reclap/test/fixtures/clap/README.md.

[dependencies]
# Default features minus `color` (no ANSI styling). `wrap_help` stays off, so
# clap never asks the terminal for its width; `term_width = 0` on each command
# turns off wrapping at the default 100 columns.
clap = { version = "=4.6.7", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "derive",
    "env",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
